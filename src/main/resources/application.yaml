spring:
  application:
    name: customer-inquiry-tracker
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate #БД создается только миграциями FlyWay
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info